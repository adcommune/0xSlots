# Static serving for the prerendered vocs site.
#
# vocs emits a directory per route (`/protocol/index.html`), so `try_files`
# has to try the directory form before giving up. This is NOT a SPA — every
# route has real HTML, so unknown paths must 404 rather than fall back to
# index.html, which would return 200 for typos and hide broken links.

server {
    # 3000, not 80: Dokploy's domain records default to port 3000 and the
    # management API rejects a numeric port override over MCP, so the container
    # meets the platform where it already points. Nothing about nginx cares.
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are content-addressed, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;
}
