fragment SlotFields on Slot {
  id
  recipient
  recipientAccount { id type slotCount occupiedCount }
  currency { id name symbol decimals }
  manager
  mutableTax
  mutableModule
  taxPercentage
  module { id verified name version feeBps moduleURI image description totalFeesCollected }
  occupant
  occupantAccount { id type slotCount occupiedCount }
  isOccupied
  price
  deposit
  collectedTax
  totalCollected
  liquidationBountyBps
  minDepositSeconds

  # v3 occupancy layer.
  # `occupant` above is the last MATERIALISED occupant — do not render it
  # directly. Pass this fragment to resolveEffectiveOccupancy(), which accounts
  # for a transfer whose boundary has passed but which no transaction has
  # applied yet. See src/occupancy.ts.
  epochSeconds
  occupancyPolicy
  occupiedSince
  pendingBuyer
  pendingEffectiveAt
  pendingPrice
  pendingDeposit
  pendingPolicy
  hasPendingPolicy

  createdAt
  createdTx
  updatedAt
}

query GetSlots(
  $first: Int!
  $skip: Int
  $orderBy: Slot_orderBy
  $orderDirection: OrderDirection
  $where: Slot_filter
  $block: Block_height
) {
  slots(
    first: $first
    skip: $skip
    orderBy: $orderBy
    orderDirection: $orderDirection
    where: $where
    block: $block
  ) {
    ...SlotFields
  }
}

query GetSlot($id: ID!, $block: Block_height) {
  slot(id: $id, block: $block) {
    ...SlotFields
  }
}

query GetSlotsByRecipient(
  $recipient: Bytes!
  $first: Int!
  $skip: Int
  $orderBy: Slot_orderBy
  $orderDirection: OrderDirection
  $block: Block_height
) {
  slots(
    first: $first
    skip: $skip
    orderBy: $orderBy
    orderDirection: $orderDirection
    where: { recipient: $recipient }
    block: $block
  ) {
    ...SlotFields
  }
}

query GetSlotsByOccupant(
  $occupant: Bytes!
  $first: Int!
  $skip: Int
  $orderBy: Slot_orderBy
  $orderDirection: OrderDirection
  $block: Block_height
) {
  slots(
    first: $first
    skip: $skip
    orderBy: $orderBy
    orderDirection: $orderDirection
    where: { occupant: $occupant }
    block: $block
  ) {
    ...SlotFields
  }
}

fragment SlotMetadataFields on MetadataSlot {
  id
  uri
  rawJson
  adType
  updatedBy
  updateCount
  createdAt
  createdTx
  updatedAt
  updatedTx
}

query GetSlotsWithMetadata(
  $first: Int!
  $skip: Int
  $orderBy: Slot_orderBy
  $orderDirection: OrderDirection
  $where: Slot_filter
  $block: Block_height
) {
  slots(
    first: $first
    skip: $skip
    orderBy: $orderBy
    orderDirection: $orderDirection
    where: $where
    block: $block
  ) {
    ...SlotFields
    metadata {
      ...SlotMetadataFields
    }
  }
}